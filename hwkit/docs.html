<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HWKit GUI Documentation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #ffffff; --fg: #1c1e21; --muted: #6b7280; --border: #e5e7eb;
  --accent: #2563eb; --code-bg: #f3f4f6; --sidebar-bg: #fafafa;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --border:#262a33;
    --accent:#60a5fa; --code-bg:#1a1d24; --sidebar-bg:#14161b; }
}
:root[data-theme="dark"] { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --border:#262a33;
  --accent:#60a5fa; --code-bg:#1a1d24; --sidebar-bg:#14161b; }
:root[data-theme="light"] { --bg:#ffffff; --fg:#1c1e21; --muted:#6b7280; --border:#e5e7eb;
  --accent:#2563eb; --code-bg:#f3f4f6; --sidebar-bg:#fafafa; }

* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--fg); background: var(--bg); display: flex; min-height: 100vh;
}
.sidebar {
  width: 260px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border);
  padding: 1rem; overflow-y: auto; height: 100vh; position: sticky; top: 0;
}
.sidebar h1 { font-size: 1rem; margin: 0 0 1rem; }
.tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; }
.tab-btn {
  flex: 1; padding: 0.4rem; font-size: 0.85rem; border: 1px solid var(--border); background: var(--bg);
  color: var(--fg); border-radius: 6px; cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-section { margin-bottom: 0.75rem; }
.nav-file { font-weight: 600; font-size: 0.85rem; margin: 0.6rem 0 0.2rem; color: var(--muted); }
.nav-link {
  display: block; font-size: 0.85rem; padding: 0.15rem 0 0.15rem 0.6rem; color: var(--fg);
  text-decoration: none; border-left: 2px solid transparent; word-break: break-word;
}
.nav-link:hover { border-left-color: var(--accent); color: var(--accent); }
.nav-link.indent { padding-left: 1.2rem; color: var(--muted); }

main { flex: 1; padding: 2rem 3rem; max-width: 900px; overflow-x: auto; }
.view { display: none; }
.view.active { display: block; }
#view-manual.active { display: flex; margin: -2rem -3rem; }
.manual-frame { flex: 1; width: 100%; min-height: 100vh; border: none; }

.module { margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.module h2 { font-family: monospace; font-size: 1.3rem; margin-bottom: 0.3rem; }
.module .module-doc { color: var(--muted); white-space: pre-wrap; margin-bottom: 1rem; }

.entity { margin: 1.2rem 0 1.2rem 0.5rem; padding-left: 0.8rem; border-left: 2px solid var(--border); }
.entity h3 { font-family: monospace; font-size: 1.05rem; margin: 0 0 0.3rem; }
.entity h4 { font-family: monospace; font-size: 0.95rem; margin: 0.8rem 0 0.2rem 1rem; color: var(--fg); }
.sig { color: var(--muted); font-weight: normal; }
.doc { white-space: pre-wrap; background: var(--code-bg); border-radius: 6px; padding: 0.6rem 0.8rem;
  font-size: 0.9rem; margin: 0.3rem 0 0.3rem 1rem; }
.no-doc { color: var(--muted); font-style: italic; font-size: 0.85rem; margin-left: 1rem; }
.desc { white-space: pre-wrap; font-size: 0.9rem; margin: 0.3rem 0 0.5rem 1rem; }
.argtable { border-collapse: collapse; margin: 0.4rem 0 0.6rem 1rem; font-size: 0.85rem; width: calc(100% - 1rem); }
.argtable th { text-align: left; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 0.25rem 0.9rem 0.25rem 0; border-bottom: 1px solid var(--border); }
.argtable td { padding: 0.3rem 0.9rem 0.3rem 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.argtable tr:last-child td { border-bottom: none; }
.argname { font-family: monospace; white-space: nowrap; }
.argtype { color: var(--muted); font-family: monospace; font-size: 0.8rem; }
.secblock { font-size: 0.85rem; margin: 0.35rem 0 0.35rem 1rem; white-space: pre-wrap; }
.secblock .lbl { display: inline-block; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin-right: 0.5rem; }

.manual-section { margin-bottom: 1.5rem; }
.manual-section h2 { font-size: 1.15rem; margin-bottom: 0.4rem; }
.manual-section ul { margin: 0; padding-left: 1.4rem; color: var(--muted); }
.manual-section li { padding: 0.15rem 0; }
.manual-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
</style>
</head>
<body>

<nav class="sidebar">
  <h1>HWKit GUI Docs</h1>
  <div class="tabs">
    <button class="tab-btn active" data-view="reference">Reference</button>
    <button class="tab-btn" data-view="manual">Manual</button>
  </div>
  <div id="nav-reference"></div>
  <div id="nav-manual" style="display:none"></div>
</nav>

<main>
  <section id="view-reference" class="view active"></section>
  <section id="view-manual" class="view"></section>
</main>

k.py", "doc": "The front end you edit to try a new experiment: network architecture +\ntraining hyperparameters. Imported by simulation.py; run `python main.py`\nto launch the GUI, not this file directly.", "classes": [{"name": "FlattenAnalogSequential", "doc": "Flattens 2D image input before feeding it to the wrapped layers.", "methods": [{"name": "forward", "args": ["x"], "doc": null, "parsed": null}], "parsed": {"description": "Flattens 2D image input before feeding it to the wrapped layers.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "CNNAnalogSequential", "doc": "Applies the convolutional layers to the (batch, channels, size, size)\nimage input, flattens once the conv stack is done, then applies the\nfully-connected layers.", "methods": [{"name": "__init__", "args": ["conv_layers", "fc_layers"], "doc": null, "parsed": null}, {"name": "forward", "args": ["x"], "doc": "_summary_\n\nArgs:\n    x (any): image data of the image\n\nReturns:\n    any: image forwarded trough the network", "parsed": {"description": "_summary_", "args": [{"name": "x", "type": "any", "desc": "image data of the image"}], "returns": "any: image forwarded trough the network", "raises": "", "note": ""}}], "parsed": {"description": "Applies the convolutional layers to the (batch, channels, size, size)\nimage input, flattens once the conv stack is done, then applies the\nfully-connected layers.", "args": [], "returns": "", "raises": "", "note": ""}}], "functions": [{"name": "mlp", "args": ["rpu_config", "args", "input_channels", "input_size"], "doc": "Build an MLP from args -- the dict gui_frontend.App.do_config_network()\nproduces (and config_loading.load_network()/dump_network() round-trip\nto/from a .net file):\n\nArgs:\n    rpu_config (_type_): loaded from the file / file type\n    args (ArrayLike): args to build the network\n    input_channels (int, optional): input chanels (Color 3/ BW 1). Defaults to 1.\n    input_size (int, optional): (nxn of the input). Defaults to 28.\n\nReturns:\n    _type_: model of the System", "parsed": {"description": "Build an MLP from args -- the dict gui_frontend.App.do_config_network()\nproduces (and config_loading.load_network()/dump_network() round-trip\nto/from a .net file):", "args": [{"name": "rpu_config", "type": "_type_", "desc": "loaded from the file / file type"}, {"name": "args", "type": "ArrayLike", "desc": "args to build the network"}, {"name": "input_channels", "type": "int, optional", "desc": "input chanels (Color 3/ BW 1). Defaults to 1."}, {"name": "input_size", "type": "int, optional", "desc": "(nxn of the input). Defaults to 28."}], "returns": "_type_: model of the System", "raises": "", "note": ""}}, {"name": "cnn", "args": ["rpu_config", "args", "input_channels", "input_size"], "doc": "Build an CNN from args -- the dict gui_frontend.App.do_config_network()\nproduces (and config_loading.load_network()/dump_network() round-trip\nto/from a .net file):\n\nArgs:\n    rpu_config (_type_): loaded from the file / file type\n    args (ArrayLike): args to build the network\n    input_channels (int, optional): input chanels (Color 3/ BW 1). Defaults to 1.\n    input_size (int, optional): (nxn of the input). Defaults to 28.\n\nRaises:\n    ValueError: due to no padding the convolution image gets smaller\n\nReturns:\n    _type_: model of the system", "parsed": {"description": "Build an CNN from args -- the dict gui_frontend.App.do_config_network()\nproduces (and config_loading.load_network()/dump_network() round-trip\nto/from a .net file):", "args": [{"name": "rpu_config", "type": "_type_", "desc": "loaded from the file / file type"}, {"name": "args", "type": "ArrayLike", "desc": "args to build the network"}, {"name": "input_channels", "type": "int, optional", "desc": "input chanels (Color 3/ BW 1). Defaults to 1."}, {"name": "input_size", "type": "int, optional", "desc": "(nxn of the input). Defaults to 28."}], "returns": "_type_: model of the system", "raises": "ValueError: due to no padding the convolution image gets smaller", "note": ""}}, {"name": "build_model", "args": ["rpu_config", "net_type", "args", "input_channels", "input_size"], "doc": "Defines the network architecture\n\nArgs:\n    rpu_config (_type_): RPU config for the analog layers, or None to build the\n        purely digital software baseline (plain nn.Linear/nn.Conv2d, \"Ideal\" mode)\n    net_type (str): type of the network\n    args (ArrayLike): args to build the network\n    input_channels (int, optional): input chanels (Color 3/ BW 1). Defaults to 1.\n    input_size (int, optional): (nxn of the input). Defaults to 28.\n\nRaises:\n    ValueError: Unknown network type\n\nReturns:\n    _type_: Network", "parsed": {"description": "Defines the network architecture", "args": [{"name": "rpu_config", "type": "_type_", "desc": "RPU config for the analog layers, or None to build the purely digital software baseline (plain nn.Linear/nn.Conv2d, \"Ideal\" mode)"}, {"name": "net_type", "type": "str", "desc": "type of the network"}, {"name": "args", "type": "ArrayLike", "desc": "args to build the network"}, {"name": "input_channels", "type": "int, optional", "desc": "input chanels (Color 3/ BW 1). Defaults to 1."}, {"name": "input_size", "type": "int, optional", "desc": "(nxn of the input). Defaults to 28."}], "returns": "_type_: Network", "raises": "ValueError: Unknown network type", "note": ""}}]}, {"file": "device_fitting.py", "doc": null, "classes": [], "functions": [{"name": "fitting", "args": ["path", "noise", "unit", "plot", "embed_in", "device_classes"], "doc": "Fits every device type in `device_classes` to the data in file points: flat sequence of 2*n measured physical conductances.\n    `points` arg:\n        points[0:n]  -- LTP sweep: n pulses applied from the device's\n                         minimum conductance\n        points[n:2n] -- LTD sweep: n pulses applied from the device's\n                         maximum conductance\n\nThe measured conductances are converted to uS and then normalized: the weight is\n(G - offset) / scale with offset = (G_max + G_min)/2 and scale = (G_max - G_min)/2,\nso every fitted device spans [-1, +1] regardless of the measurement unit. This keeps\nthe training behaviour (learning rates, dw_min, ADC bounds) independent of the unit\nthe file happened to be written in; offset and scale are returned with each candidate\n(and saved into the .fit file) so weights can always be mapped back to physical\nconductance: G = w * scale + offset (in uS).\n\nFitting Parameters are set in code\nArgs:\n    path (str): Path to the .txt with the measurment data\n    noise (ArrayLike): Array of the Noise Values\n    unit (str): unit the values in `path` are written in, one of UNIT_MILTIPLIERS's\n        keys. Defaults to \"uS\".\n    plot (bool, optional): optional standalone Plot of the best (lowest-rmse) candidate. Defaults to True.\n    embed_in (_type_, optional): optional embedded Plot of the best (lowest-rmse) candidate. Defaults to None.\n    device_classes (dict, optional): {name: device class} to fit. Defaults to DEVICE_CLASSES (all supported types).\n\nRaises:\n    ValueError: if number of points is not even, if all values are identical, or if\n        no device could be fit (the message then lists each device type's failure reason)\n\nReturns:\n    list[dict]: one entry per device type that could be fit, sorted by\n        ascending rmse (best first). Each entry holds:\n        \"name\" (str), \"device_config\" (fitted device, noise already applied),\n        \"offset\" (float, uS), \"scale\" (float, uS per weight unit), \"rmse\" (float),\n        \"title\" (str), \"pulses_per_direction\", \"ltp_fit\", \"ltd_fit\",\n        \"ltp_weights\", \"ltd_weights\" (ndarray)\n    list[tuple]: (device type name, reason) for every device type that could NOT\n        be fit -- empty when everything fit", "parsed": {"description": "Fits every device type in `device_classes` to the data in file points: flat sequence of 2*n measured physical conductances.\n    `points` arg:\n        points[0:n]  -- LTP sweep: n pulses applied from the device's\n                         minimum conductance\n        points[n:2n] -- LTD sweep: n pulses applied from the device's\n                         maximum conductance\n\nThe measured conductances are converted to uS and then normalized: the weight is\n(G - offset) / scale with offset = (G_max + G_min)/2 and scale = (G_max - G_min)/2,\nso every fitted device spans [-1, +1] regardless of the measurement unit. This keeps\nthe training behaviour (learning rates, dw_min, ADC bounds) independent of the unit\nthe file happened to be written in; offset and scale are returned with each candidate\n(and saved into the .fit file) so weights can always be mapped back to physical\nconductance: G = w * scale + offset (in uS).\n\nFitting Parameters are set in code", "args": [{"name": "path", "type": "str", "desc": "Path to the .txt with the measurment data"}, {"name": "noise", "type": "ArrayLike", "desc": "Array of the Noise Values"}, {"name": "unit", "type": "str", "desc": "unit the values in `path` are written in, one of UNIT_MILTIPLIERS's keys. Defaults to \"uS\"."}, {"name": "plot", "type": "bool, optional", "desc": "optional standalone Plot of the best (lowest-rmse) candidate. Defaults to True."}, {"name": "embed_in", "type": "_type_, optional", "desc": "optional embedded Plot of the best (lowest-rmse) candidate. Defaults to None."}, {"name": "device_classes", "type": "dict, optional", "desc": "{name: device class} to fit. Defaults to DEVICE_CLASSES (all supported types)."}], "returns": "list[dict]: one entry per device type that could be fit, sorted by\n        ascending rmse (best first). Each entry holds:\n        \"name\" (str), \"device_config\" (fitted device, noise already applied),\n        \"offset\" (float, uS), \"scale\" (float, uS per weight unit), \"rmse\" (float),\n        \"title\" (str), \"pulses_per_direction\", \"ltp_fit\", \"ltd_fit\",\n        \"ltp_weights\", \"ltd_weights\" (ndarray)\n    list[tuple]: (device type name, reason) for every device type that could NOT\n        be fit -- empty when everything fit", "raises": "ValueError: if number of points is not even, if all values are identical, or if\n        no device could be fit (the message then lists each device type's failure reason)", "note": ""}}, {"name": "_safe_eval", "args": ["node"], "doc": "Evaluates the AST of a .fit file without running arbitrary code (unlike eval()):\nonly literals, +/- signs, lists/tuples/dicts and calls to the whitelisted device\nclasses above are allowed -- anything else raises.\n\nArgs:\n    node (ast.AST): node to evaluate\n\nRaises:\n    ValueError: on any syntax outside the whitelist\n\nReturns:\n    any: the evaluated value", "parsed": {"description": "Evaluates the AST of a .fit file without running arbitrary code (unlike eval()):\nonly literals, +/- signs, lists/tuples/dicts and calls to the whitelisted device\nclasses above are allowed -- anything else raises.", "args": [{"name": "node", "type": "ast.AST", "desc": "node to evaluate"}], "returns": "any: the evaluated value", "raises": "ValueError: on any syntax outside the whitelist", "note": ""}}, {"name": "load_device", "args": ["path"], "doc": "Loads a .fit file. Parsed through _safe_eval() -- a .fit file is data, not code,\nso nothing outside the whitelisted device constructors can run.\n\nHandles both formats: the current one, a dict holding the device plus the physical\nmapping ({\"device\": ..., \"offset\": <uS>, \"scale\": <uS per weight unit>}), and the\nlegacy one, a bare device repr -- there the mapping was never saved, so offset and\nscale come back as None (weights cannot be mapped back to physical conductance).\n\nArgs:\n    path (str): path of the .fit file\n\nReturns:\n    dict: {\"device\": device config, \"offset\": float | None, \"scale\": float | None}", "parsed": {"description": "Loads a .fit file. Parsed through _safe_eval() -- a .fit file is data, not code,\nso nothing outside the whitelisted device constructors can run.\n\nHandles both formats: the current one, a dict holding the device plus the physical\nmapping ({\"device\": ..., \"offset\": <uS>, \"scale\": <uS per weight unit>}), and the\nlegacy one, a bare device repr -- there the mapping was never saved, so offset and\nscale come back as None (weights cannot be mapped back to physical conductance).", "args": [{"name": "path", "type": "str", "desc": "path of the .fit file"}], "returns": "dict: {\"device\": device config, \"offset\": float | None, \"scale\": float | None}", "raises": "", "note": ""}}, {"name": "probe_device_response", "args": ["device", "num_pulses"], "doc": "Makes a LTP/LTD Simulation for displaying it out of a .fit file\n\nNote: if the device carries device-to-device variation (dw_min_dtod, w_min_dtod,\nw_max_dtod > 0), the 1x1 probe tile draws one random device instance per call --\nthe preview curve then differs every time the same .fit is loaded. That is the\nvariation working as configured, not data corruption.\n\nArgs:\n    device (SoftBoundsDevice): device \n    num_pulses (int, optional): number of pulses per LTD/LTP. Defaults to 50.\n\nReturns:\n    ndarray: ltp_curve, ltd_curve", "parsed": {"description": "Makes a LTP/LTD Simulation for displaying it out of a .fit file", "args": [{"name": "device", "type": "SoftBoundsDevice", "desc": "device"}, {"name": "num_pulses", "type": "int, optional", "desc": "number of pulses per LTD/LTP. Defaults to 50."}], "returns": "ndarray: ltp_curve, ltd_curve", "raises": "", "note": "if the device carries device-to-device variation (dw_min_dtod, w_min_dtod,\nw_max_dtod > 0), the 1x1 probe tile draws one random device instance per call --\nthe preview curve then differs every time the same .fit is loaded. That is the\nvariation working as configured, not data corruption."}}]}, {"file": "framework.py", "doc": null, "classes": [{"name": "AnalogFramework", "doc": "Device-agnostic-to-the-caller trai th live sync during the training\nand device fig for the currently loaded LTP / LTD config.\nCan be implemeanted in a Host UI.\nFigureCanvasTkAgg(plot.training_fig, master=...) /\nFigureCanvasTkAgg(plot.device_fig, master=...) -- doesn't manage its own\nwindow or process", "args": [], "returns": "", "raises": "", "note": ""}}], "functions": []}, {"file": "gui_helpers.py", "doc": "Helper functions used by gui_frontend.App that aren't themselves widget\nconstruction file dialogs, ttk styling, and text/data formatting. \nKeptseparate so the frontend module stays limited to layout and thin event\nhandlers.", "classes": [], "functions": [{"name": "mono_font", "args": ["size"], "doc": "Returns the first monospace font family installed on this platform\n(Menlo on macOS, Consolas on Windows, DejaVu on Linux), as a tkinter\nfont tuple. Must be called after the Tk root exists.\n\nArgs:\n    size (int, optional): point size. Defaults to 11.\n\nReturns:\n    tuple: (family, size) for tkinter font options", "parsed": {"description": "Returns the first monospace font family installed on this platform\n(Menlo on macOS, Consolas on Windows, DejaVu on Linux), as a tkinter\nfont tuple. Must be called after the Tk root exists.", "args": [{"name": "size", "type": "int, optional", "desc": "point size. Defaults to 11."}], "returns": "tuple: (family, size) for tkinter font options", "raises": "", "note": ""}}, {"name": "apply_style", "args": ["widget"], "doc": "Configure the ttk styles the frontend's widgets use, scoped to\n`widget`'s Tk interpreter. Called once from App.__init__.", "parsed": {"description": "Configure the ttk styles the frontend's widgets use, scoped to\n`widget`'s Tk interpreter. Called once from App.__init__.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "missing_config_message", "args": ["device", "config", "network"], "doc": "Return a warning message listing which of device/config/network are\nstill unset, or None if all three are ready to simulate. All three are\nrequired -- there is deliberately no silent default fallback: whatever a\nsimulation runs with must have been configured or loaded explicitly.\n\nArgs:\n    device (_type_): the current device configuration\n    config (_type_): the loaded simulation configuration\n    network (_type_): the current network configuration\n\nReturns:\n    string: warning message", "parsed": {"description": "Return a warning message listing which of device/config/network are\nstill unset, or None if all three are ready to simulate. All three are\nrequired -- there is deliberately no silent default fallback: whatever a\nsimulation runs with must have been configured or loaded explicitly.", "args": [{"name": "device", "type": "_type_", "desc": "the current device configuration"}, {"name": "config", "type": "_type_", "desc": "the loaded simulation configuration"}, {"name": "network", "type": "_type_", "desc": "the current network configuration"}], "returns": "string: warning message", "raises": "", "note": ""}}, {"name": "format_results_row", "args": ["epoch", "test_acc", "train_acc", "loss"], "doc": "One line of the results CSV matches RESULTS_CSV_HEADER's columns.", "parsed": {"description": "One line of the results CSV matches RESULTS_CSV_HEADER's columns.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "open_file", "args": ["file_format"], "doc": "saves the path to a file from a file dialog\n\nArgs:\n    file_format (string): file type\n\nReturns:\n    \"string\": path to the file", "parsed": {"description": "saves the path to a file from a file dialog", "args": [{"name": "file_format", "type": "string", "desc": "file type"}], "returns": "\"string\": path to the file", "raises": "", "note": ""}}, {"name": "save_file", "args": ["file_format", "data"], "doc": "write the data to a specific file in format\n\nArgs:\n    file_format (\"string\"): file type\n    data (any): data", "parsed": {"description": "write the data to a specific file in format", "args": [{"name": "file_format", "type": "\"string\"", "desc": "file type"}, {"name": "data", "type": "any", "desc": "data"}], "returns": "", "raises": "", "note": ""}}, {"name": "section", "args": ["title"], "doc": "A short divider line used to separate blocks in the text panels,\ne.g. '\u2500\u2500 Fitted Device '.ljust(.... , '\u2500').\u00c4\n\nArgs:\n    title (string): title of the divider line\n\nReturns:\n    _type_: divider line", "parsed": {"description": "A short divider line used to separate blocks in the text panels,\ne.g. '\u2500\u2500 Fitted Device '.ljust(.... , '\u2500').\u00c4", "args": [{"name": "title", "type": "string", "desc": "title of the divider line"}], "returns": "_type_: divider line", "raises": "", "note": ""}}, {"name": "describe", "args": ["value"], "doc": "Render a possibly-None plain value (e.g. offset) for display.\n\nArgs:\n    value (any): value to transform\n\nReturns:\n    string: value as string or None if value == None", "parsed": {"description": "Render a possibly-None plain value (e.g. offset) for display.", "args": [{"name": "value", "type": "any", "desc": "value to transform"}], "returns": "string: value as string or None if value == None", "raises": "", "note": ""}}, {"name": "describe_dict", "args": ["value"], "doc": "Pretty-print a dict (e.g. a .sim/.net config) as indented JSON\ninstead of Python's single-line dict repr.\n    Args:\n    value (dict): dict to transform\n\nReturns:\n    string: dict as string or None if value == None", "parsed": {"description": "Pretty-print a dict (e.g. a .sim/.net config) as indented JSON\ninstead of Python's single-line dict repr.", "args": [{"name": "value", "type": "dict", "desc": "dict to transform"}], "returns": "string: dict as string or None if value == None", "raises": "", "note": ""}}, {"name": "describe_results", "args": ["results"], "doc": "Summarize the results (epoch count + last row) instead of\ndumping the whole (potentially long) results into a small panel.\nArgs:\n    results (any): results to shorten\n\nReturns:\n    string: values of the last epoch, the number of the epochs, the last test acc, the last train acc, the last loss", "parsed": {"description": "Summarize the results (epoch count + last row) instead of\ndumping the whole (potentially long) results into a small panel.", "args": [{"name": "results", "type": "any", "desc": "results to shorten"}], "returns": "string: values of the last epoch, the number of the epochs, the last test acc, the last train acc, the last loss", "raises": "", "note": ""}}, {"name": "format_results_metadata", "args": ["device", "offset", "scale", "config", "network"], "doc": "Comment block written at the top of every results CSV so a saved result\nalways carries the full run configuration it came from. Every line starts\nwith \"#\", so CSV tools and describe_results() skip them.\n\nArgs:\n    device (_type_): the fitted device the run used\n    offset (float | None): conductance offset (uS)\n    scale (float | None): conductance scale (uS per weight unit)\n    config (dict): the simulation config\n    network (dict): the network config\n\nReturns:\n    string: \"#\"-prefixed metadata lines, newline-terminated", "parsed": {"description": "Comment block written at the top of every results CSV so a saved result\nalways carries the full run configuration it came from. Every line starts\nwith \"#\", so CSV tools and describe_results() skip them.", "args": [{"name": "device", "type": "_type_", "desc": "the fitted device the run used"}, {"name": "offset", "type": "float | None", "desc": "conductance offset (uS)"}, {"name": "scale", "type": "float | None", "desc": "conductance scale (uS per weight unit)"}, {"name": "config", "type": "dict", "desc": "the simulation config"}, {"name": "network", "type": "dict", "desc": "the network config"}], "returns": "string: \"#\"-prefixed metadata lines, newline-terminated", "raises": "", "note": ""}}, {"name": "format_state_text", "args": ["fit_device_config", "offset", "scale", "config", "network", "results"], "doc": "Build the text shown in the GUI's Current Data panel: everything\ncurrently held in memory and ready to be saved.\n\nArgs:\n    fit_device_config (_type_): current device\n    offset (_type_): offset value (uS) -- None for legacy .fit files\n    scale (_type_): scale value (uS per normalized weight unit) -- None for legacy .fit files\n    config (_type_): current config dict\n    network (_type_): current network dict\n    results (_type_): last results\n\nReturns:\n    string: formatted output", "parsed": {"description": "Build the text shown in the GUI's Current Data panel: everything\ncurrently held in memory and ready to be saved.", "args": [{"name": "fit_device_config", "type": "_type_", "desc": "current device"}, {"name": "offset", "type": "_type_", "desc": "offset value (uS) -- None for legacy .fit files"}, {"name": "scale", "type": "_type_", "desc": "scale value (uS per normalized weight unit) -- None for legacy .fit files"}, {"name": "config", "type": "_type_", "desc": "current config dict"}, {"name": "network", "type": "_type_", "desc": "current network dict"}, {"name": "results", "type": "_type_", "desc": "last results"}], "returns": "string: formatted output", "raises": "", "note": ""}}, {"name": "format_analog_summary", "args": ["info"], "doc": "Compact, narrow-panel rendering of an aihwkit AnalogInfo report.\nIts own str(info) renders a table hundreds of characters wide \n\nUses info.layer_summary/total_tile_number/total_nb_analog -- the\nvalues AnalogInfo.__init__ already computed -- rather than calling\ninfo.create_layer_summary()/calculate_num_tiles()/calculate_num_analog()\nagain, which would re-register forward hooks and re-run the model,\ndouble-counting everything.\n\nArgs:\n info(string): output of the Analog Summary\nReturns:\n string: formated text ", "parsed": {"description": "Compact, narrow-panel rendering of an aihwkit AnalogInfo report.\nIts own str(info) renders a table hundreds of characters wide\n\nUses info.layer_summary/total_tile_number/total_nb_analog -- the\nvalues AnalogInfo.__init__ already computed -- rather than calling\ninfo.create_layer_summary()/calculate_num_tiles()/calculate_num_analog()\nagain, which would re-register forward hooks and re-run the model,\ndouble-counting everything.", "args": [{"name": "info", "type": "string", "desc": "output of the Analog Summary"}], "returns": "string: formated text", "raises": "", "note": ""}}]}, {"file": "gui_frontend.py", "doc": "Frontend of the GUI launches Simulation / read write so on", "classes": [{"name": "App", "doc": "Class of the GUI, makes the main gui object and saves the current loaded configurations\nAttributes:\n   fit_device_config: Properties of the fitted or loaded device and the Device used in Simulation (.fit)\n   offset: offset of the relative weight to the physical conductance value \n   config: config of the simulation generated or loaded (.sim)\n   network: config of the neural network generated or loaded (.net)\n   results: results after simulation (Epoch, Test Acc, Train Acc, Loss)\n   runnter: thread of the simulation (set after pressing simulate)\n   plot: mpl object to plot data \n   canvas: object to plot data\n   canvas_device: object to plot device data", "methods": [{"name": "__init__", "args": ["root"], "doc": null, "parsed": null}, {"name": "_build_menu", "args": ["root"], "doc": "Native top menu bar (macOS: the system menu bar; Windows: in-window bar)\nwith Load/Save grouped into submenus and a Help menu opening the docs.", "parsed": {"description": "Native top menu bar (macOS: the system menu bar; Windows: in-window bar)\nwith Load/Save grouped into submenus and a Help menu opening the docs.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "_open_doc", "args": ["filename", "tab"], "doc": "Open a documentation file shipped next to the source in the default\nbrowser -- works the same on macOS and Windows.\n\nArgs:\n    filename (str): file next to the sources, e.g. \"docs.html\"\n    tab (str, optional): fragment appended as #tab -- docs.html uses it to start\n        on a predefined tab (\"manual\" or \"reference\"), switchable in the page.", "parsed": {"description": "Open a documentation file shipped next to the source in the default\nbrowser -- works the same on macOS and Windows.", "args": [{"name": "filename", "type": "str", "desc": "file next to the sources, e.g. \"docs.html\""}, {"name": "tab", "type": "str, optional", "desc": "fragment appended as #tab -- docs.html uses it to start on a predefined tab (\"manual\" or \"reference\"), switchable in the page."}], "returns": "", "raises": "", "note": ""}}, {"name": "_embed_plot", "args": ["plot"], "doc": "(Re)embed a Plot instance's two figures (training_fig into\nplot_frame, device_fig into device_plot_frame), replacing any\npreviously embedded canvases. only used once, at startup.", "parsed": {"description": "(Re)embed a Plot instance's two figures (training_fig into\nplot_frame, device_fig into device_plot_frame), replacing any\npreviously embedded canvases. only used once, at startup.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "refresh_state_view", "args": [], "doc": "Show what's currently held in memory and ready to be saved, called if new data is loaded/created", "parsed": {"description": "Show what's currently held in memory and ready to be saved, called if new data is loaded/created", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "set_notes_text", "args": ["text"], "doc": "Replace the Notes panel's content. Called by\n_show_analog_summary() on every Simulate press", "parsed": {"description": "Replace the Notes panel's content. Called by\n_show_analog_summary() on every Simulate press", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "_set_status", "args": ["text", "kind"], "doc": "Set the status bar to a text and color of the text\n\nArgs:\n    text (_type_): Text to display at status bar\n    kind (str, optional): Color of the Text, defined in the gui_helpers.py . Defaults to \"muted\".", "parsed": {"description": "Set the status bar to a text and color of the text", "args": [{"name": "text", "type": "_type_", "desc": "Text to display at status bar"}, {"name": "kind", "type": "str, optional", "desc": "Color of the Text, defined in the gui_helpers.py . Defaults to \"muted\"."}], "returns": "", "raises": "", "note": ""}}, {"name": "do_fit", "args": [], "doc": "do fit if button is pressed, loads conductance values handles the gui response. if currently Simulation or Fitting ongoing button is disabled.\nOpens ONE combined settings window (conductance unit + the four variation\nparameters), fits every supported device type against the data and lets the\nuser pick which fitted device to keep.", "parsed": {"description": "do fit if button is pressed, loads conductance values handles the gui response. if currently Simulation or Fitting ongoing button is disabled.\nOpens ONE combined settings window (conductance unit + the four variation\nparameters), fits every supported device type against the data and lets the\nuser pick which fitted device to keep.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "_open_device_choice_dialog", "args": ["candidates", "failures"], "doc": "Modal dialog listing every device type device_fitting.fitting() managed to fit\nagainst the measurement file, best (lowest rmse) first. Selecting a row\npreviews that candidate's simulated LTP/LTD response against the measured\npoints in the device response plot. \"Select\" commits the highlighted\ncandidate and returns it; closing the window or \"Cancel\" returns None.\nDevice types that could not be fit are listed below the choices with their\nfailure reason, so a missing candidate is never a silent mystery.\n\nArgs:\n    candidates (list[dict]): candidates as returned by device_fitting.fitting()\n    failures (list[tuple], optional): (name, reason) for device types that could\n        not be fit, as returned by device_fitting.fitting(). Defaults to None.\n\nReturns:\n    dict | None: the chosen candidate, or None if cancelled", "parsed": {"description": "Modal dialog listing every device type device_fitting.fitting() managed to fit\nagainst the measurement file, best (lowest rmse) first. Selecting a row\npreviews that candidate's simulated LTP/LTD response against the measured\npoints in the device response plot. \"Select\" commits the highlighted\ncandidate and returns it; closing the window or \"Cancel\" returns None.\nDevice types that could not be fit are listed below the choices with their\nfailure reason, so a missing candidate is never a silent mystery.", "args": [{"name": "candidates", "type": "list[dict]", "desc": "candidates as returned by device_fitting.fitting()"}, {"name": "failures", "type": "list[tuple], optional", "desc": "(name, reason) for device types that could not be fit, as returned by device_fitting.fitting(). Defaults to None."}], "returns": "dict | None: the chosen candidate, or None if cancelled", "raises": "", "note": ""}}, {"name": "do_load", "args": [], "doc": "open .fit file in dialog", "parsed": {"description": "open .fit file in dialog", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "_load_and_display_device", "args": ["path"], "doc": "Load a device from a .fit file and show its LTP/LTD response (only the Simulation of the Device).\n   Shared by the explicit Load button. Also set the .fit_device_config. \n\nArgs:\n    path : path to the .fit file\n\nReturns:\n    device: device loaded from the file", "parsed": {"description": "Load a device from a .fit file and show its LTP/LTD response (only the Simulation of the Device).\n   Shared by the explicit Load button. Also set the .fit_device_config.", "args": [{"name": "path", "type": "", "desc": "path to the .fit file"}], "returns": "device: device loaded from the file", "raises": "", "note": ""}}, {"name": "do_simulate", "args": [] on.\nThe conv section only shows while CNN is selected. Prefills from the\ncurrently loaded/configured self.network if there is one. Save builds the\nsame dict network.mlp()/network.cnn() consume and stores it on self.network.", "parsed": {"description": "One window for the whole network configuration -- replaces the old chain of\ntype/count prompts: a type dropdown (MLP/CNN), dynamic layer rows with\nadd/remove buttons for the conv and hidden layers, and the activation.\nThe conv section only shows while CNN is selected. Prefills from the\ncurrently loaded/configured self.network if there is one. Save builds the\nsame dict network.mlp()/network.cnn() consume and stores it on self.network.", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "save_fit", "args": [], "doc": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .fit data\n        ", "parsed": {"description": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .fit data", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "save_sim_config", "args": [], "doc": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .sim data\n        ", "parsed": {"description": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .sim data", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "save_network", "args": [], "doc": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .net data\n        ", "parsed": {"description": "checks if data is currently in the programm, otherwise warining, opening then safe dialog for .net data", "args": [], "returns": "", "raises": "", "note": ""}}, {"name": "save_generic", "args": ["file_format", "data", "label"], "doc": "checks if data is currently in the programm, otherwise warining, opening safe dialog for .file_format data\n\nArgs:\n    file_format (string): file format to save\n    data (any): data to save\n    label (string): label for warning if, none", "parsed": {"description": "checks if data is currently in the programm, otherwise warining, opening safe dialog for .file_format data", "args": [{"name": "file_format", "type": "string", "desc": "file format to save"}, {"name": "data", "type": "any", "desc": "data to save"}, {"name": "label", "type": "string", "desc": "label for warning if, none"}], "returns": "", "raises": "", "note": ""}}, {"name": "_open_fit_settings_dialog", "args": [], "doc": "One combined, modal window for everything the fit needs to know:\nthe conductance unit of the measurement file and the four device\nvariation parameters (0 <= x <= 1, see VAR_DEF). Blocks until closed.\n\nReturns:\n    tuple | None: (unit, {aihwkit field: value, ...}) if \"Fit\" was\n        pressed, None if the window was closed -- the caller treats\n        that as cancelling the fit", "parsed": {"description": "One combined, modal window for everything the fit needs to know:\nthe conductance unit of the measurement file and the four device\nvariation parameters (0 <= x <= 1, see VAR_DEF). Blocks until closed.", "args": [], "returns": "tuple | None: (unit, {aihwkit field: value, ...}) if \"Fit\" was\n        pressed, None if the window was closed -- the caller treats\n        that as cancelling the fit", "raises": "", "note": ""}}], "parsed": {"description": "Class of the GUI, makes the main gui object and saves the current loaded configurations", "args": [{"name": "fit_device_config", "type": "", "desc": "Properties of the fitted or loaded device and the Device used in Simulation (.fit)"}, {"name": "offset", "type": "", "desc": "offset of the relative weight to the physical conductance value"}, {"name": "config", "type": "", "desc": "config of the simulation generated or loaded (.sim)"}, {"name": "network", "type": "", "desc": "config of the neural network generated or loaded (.net)"}, {"name": "results", "type": "", "desc": "results after simulation (Epoch, Test Acc, Train Acc, Loss)"}, {"name": "runnter", "type": "", "desc": "thread of the simulation (set after pressing simulate)"}, {"name": "plot", "type": "", "desc": "mpl object to plot data"}, {"name": "canvas", "type": "", "desc": "object to plot data"}, {"name": "canvas_device", "type": "", "desc": "object to plot device data"}], "returns": "", "raises": "", "note": ""}}], "functions": []}, {"file": "batch_runner.py", "doc": "Headless batch driver: runs many simulations from a manifest, N at a time.\n\nSame code path as the GUI. The GUI's \"Simulate\" button loads a `.fit`, a `.sim` and\na `.net`, hands them to SimulationRunner and collects the progress tuples into a\nresults CSV -- this module does exactly that, without a window, once per manifest row\nand several rows in parallel.\n\nNothing in the simulator is changed or reimplemented here: device loading, config\nparsing, the run itself and the CSV formatting all call the same functions\ngui_frontend.App calls (load_device, load_sim_config, load_network,\nSimulationRunner, format_results_metadata / format_results_row).\n\nManifest (`;` or `,` separated, one row per run):\n\n    RunID;fit;sim;net;seed;out\n    A1;devices/svs.fit;configs/A1.sim;nets/mlp100.net;1;results/A1_s1.csv\n    A1;devices/svs.fit;configs/A1.sim;nets/mlp100.net;2;results/A1_s2.csv\n\n  RunID  free label, only used for logging\n  fit    .fit file, as saved by \"Save fit\"\n  sim    .sim file, as saved by \"Save simulation config\"\n  net    .net file, as saved by \"Save network\"\n  seed   overrides the \"Seed\" entry of the .sim; leave empty to keep the file's value.\n         NOTE: 0 means *unseeded* -- simulate() does `if seed: torch.manual_seed(seed)`,\n         and 0 is falsy in Python. Use 1, 2, 3 ... for repetitions.\n  out    where the results CSV goes; relative paths are relative to the manifest\n\nBecause `seed` overrides the file, one .sim per configuration is enough for ne per completed run when stdout is not a terminal, so\nredirecting into a file stays readable.", "args": [], "returns": "", "raises": "", "note": ""}}], "functions": [{"name": "read_manifest", "args": ["path"], "doc": "Read the manifest into a list of dicts, delimiter auto-detected.\n\nArgs:\n    path (Path): manifest file\n\nReturns:\n    list[dict]: one dict per run, keys as in MANIFEST_COLUMNS", "parsed": {"description": "Read the manifest into a list of dicts, delimiter auto-detected.", "args": [{"name": "path", "type": "Path", "desc": "manifest file"}], "returns": "list[dict]: one dict per run, keys as in MANIFEST_COLUMNS", "raises": "", "note": ""}}, {"name": "run_one", "args": ["row", "base_dir", "dump_sim"], "doc": "Run a single manifest row. Executed in its own process.\n\nMirrors gui_frontend.App.do_simulate()/_poll_runner(): build the results header,\nstart a SimulationRunner, drain it until it finishes, append one row per epoch.\n\nArgs:\n    row (dict): manifest row\n    base_dir (str): directory the manifest lives in; relative paths resolve against it\n    dump_sim (bool): also write the effective .sim (seed applied) next to the results\n\nReturns:\n    dict: RunID, seed, status (\"ok\" | \"error\"), epochs, seconds, message", "parsed": {"description": "Run a single manifest row. Executed in its own process.\n\nMirrors gui_frontend.App.do_simulate()/_poll_runner(): build the results header,\nstart a SimulationRunner, drain it until it finishes, append one row per epoch.", "args": [{"name": "row", "type": "dict", "desc": "manifest row"}, {"name": "base_dir", "type": "str", "desc": "directory the manifest lives in; relative paths resolve against it"}, {"name": "dump_sim", "type": "bool", "desc": "also write the effective .sim (seed applied) next to the results"}], "returns": "dict: RunID, seed, status (\"ok\" | \"error\"), epochs, seconds, message", "raises": "", "note": ""}}, {"name": "main", "args": [], "doc": null, "parsed": null}]}];

function esc(s) {
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}
function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// Structured rendering: description first, then the arguments as their own
// table, then Returns/Raises/Note blocks. Entities whose docstring could not
// be sectioned fall back to the verbatim block.
function renderDoc(entity) {
  const p = entity.parsed;
  if (!p) {
    return entity.doc ? `<div class="doc">${esc(entity.doc)}</div>`
                      : `<div class="no-doc">(no docstring)</div>`;
  }
  let h = '';
  if (p.description) h += `<div class="desc">${esc(p.description)}</div>`;
  if (p.args.length) {
    h += `<table class="argtable"><tr><th>Parameter</th><th>Type</th><th>Description</th></tr>`;
    p.args.forEach(a => {
      h += `<tr><td class="argname">${esc(a.name)}</td>` +
           `<td class="argtype">${esc(a.type)}</td><td>${esc(a.desc)}</td></tr>`;
    });
    h += `</table>`;
  }
  if (p.returns) h += `<div class="secblock"><span class="lbl">Returns</span>${esc(p.returns)}</div>`;
  if (p.raises) h += `<div class="secblock"><span class="lbl">Raises</span>${esc(p.raises)}</div>`;
  if (p.note) h += `<div class="secblock"><span class="lbl">Note</span>${esc(p.note)}</div>`;
  return h;
}

function renderReference() {
  const navEl = document.getElementById('nav-reference');
  const viewEl = document.getElementById('view-reference');
  let nav = '';
  let body = '';

  MODULES.forEach(mod => {
    const modId = slug(mod.file);
    nav += `<div class="nav-file"><a class="nav-link" href="#${modId}">${esc(mod.file)}</a></div>`;

    body += `<div class="module" id="${modId}"><h2>${esc(mod.file)}</h2>`;
    if (mod.doc) body += `<div class="module-doc">${esc(mod.doc)}</div>`;

    mod.classes.forEach(cls => {
      const cid = `${modId}-${slug(cls.name)}`;
      nav += `<a class="nav-link indent" href="#${cid}">class ${esc(cls.name)}</a>`;
      body += `<div class="entity" id="${cid}"><h3>class ${esc(cls.name)}</h3>`;
      body += renderDoc(cls);
      cls.methods.forEach(m => {
        const mid = `${cid}-${slug(m.name)}`;
        body += `<h4 id="${mid}">${esc(m.name)}(<span class="sig">${esc(m.args.join(', '))}</span>)</h4>`;
        body += renderDoc(m);
      });
      body += `</div>`;
    });

    mod.functions.forEach(fn => {
      const fid = `${modId}-${slug(fn.name)}`;
      nav += `<a class="nav-link indent" href="#${fid}">${esc(fn.name)}()</a>`;
      body += `<div class="entity" id="${fid}"><h3>${esc(fn.name)}(<span class="sig">${esc(fn.args.join(', '))}</span>)</h3>`;
      body += renderDoc(fn);
      body += `</div>`;
    });

    body += `</div>`;
  });

  navEl.innerHTML = nav;
  viewEl.innerHTML = body;
}

function renderManual() {
  document.getElementById('nav-manual').innerHTML =
    `<p class="manual-note">The full manual, embedded. ` +
    `Standalone page: <a class="nav-link" href="manual.html">manual.html</a></p>`;
  document.getElementById('view-manual').innerHTML =
    `<iframe class="manual-frame" src="manual.html" title="HWKit GUI Manual"></iframe>`;
}

function activateTab(view) {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.getElementById('nav-reference').style.display = view === 'reference' ? '' : 'none';
  document.getElementById('nav-manual').style.display = view === 'manual' ? '' : 'none';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activateTab(btn.dataset.view);
    history.replaceState(null, '', `#${btn.dataset.view}`);
  });
});

renderReference();
renderManual();
// The GUI's Help menu opens docs.html#manual or docs.html#reference to land on a
// predefined tab; every other hash is a reference anchor and keeps the default tab.
if (location.hash === '#manual') activateTab('manual');
</script>
